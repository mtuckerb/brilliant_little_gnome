<!DOCTYPE html>
<html>
<head>
    <title>Brilliant - Loading</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bulma/0.9.4/css/bulma.min.css">
    <style>
        body {
            background-color: #f5f5f5;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            overflow: hidden;
        }
        .container {
            text-align: center;
        }
        .loader-icon {
            font-size: 4rem;
            margin-bottom: 1.5rem;
            color: #48c774;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(0.95); opacity: 0.8; }
            50% { transform: scale(1.05); opacity: 1; }
            100% { transform: scale(0.95); opacity: 0.8; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="loader-icon">📦</div>
        <h1 class="title is-4">Waking up Brilliant...</h1>
        <p class="subtitle is-6 has-text-grey">Initializing Portable Ruby Sidecar</p>
        <progress class="progress is-small is-success" max="100">15%</progress>
    </div>
</body>
</html>
