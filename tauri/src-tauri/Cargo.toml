[package]
name = "brilliant-tauri"
version = "0.1.0"
description = "Brightspace LMS companion (Tauri port)"
edition = "2021"
rust-version = "1.77"

[lib]
name = "brilliant_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.1", features = [] }
tauri-plugin-shell = "2.0"

# HTTP client
reqwest = { version = "0.12", default-features = false, features = ["json", "cookies", "rustls-tls", "gzip", "brotli", "stream"] }
url = "2.5"
cookie_store = "0.21"
reqwest_cookie_store = "0.8"

# DB
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "macros", "chrono", "json", "migrate"] }
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"

# REST API (optional, embedded)
axum = { version = "0.7", features = ["json"] }
tower = "0.5"
tower-http = { version = "0.5", features = ["cors", "trace"] }
hyper = "1"

# Serde / parsing
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }

# Auth
jsonwebtoken = "9"
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
hex = "0.4"

# Misc
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
once_cell = "1"
async-trait = "0.1"
futures = "0.3"
parking_lot = "0.12"
regex = "1"
scraper = "0.20"
pulldown-cmark = "0.12"
uuid = { version = "1", features = ["v4", "serde"] }
dirs = "5"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
