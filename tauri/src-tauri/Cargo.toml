[package]
name = "brilliant-tauri"
version = "2.0.0"
description = "Brightspace LMS companion (Tauri port)"
edition = "2021"
rust-version = "1.77"

[lib]
name = "brilliant_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.1", features = [] }
tauri-plugin-shell = "2.0"

# HTTP client
reqwest = { version = "0.12", default-features = false, features = ["json", "cookies", "rustls-tls", "gzip", "brotli", "stream"] }
url = "2.5"
cookie_store = "0.21"
reqwest_cookie_store = "0.8"

# DB
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "macros", "chrono", "json", "migrate"] }
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"

# REST API (optional, embedded)
axum = { version = "0.7", features = ["json"] }
tower = "0.5"
tower-http = { version = "0.5", features = ["cors", "trace"] }
hyper = "1"

# Serde / parsing
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }

# TLS crypto provider. reqwest 0.13 (pulled in transitively by iroh and
# tauri) uses rustls 0.23, which since that version refuses to construct
# a TLS client until the application explicitly installs a CryptoProvider.
# We install ring at startup so every rustls consumer in the binary
# (reqwest 0.12, reqwest 0.13, iroh, hickory) shares the same provider.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }

# Auth
jsonwebtoken = "9"
hmac = "0.12"
sha2 = "0.10"
md-5 = "0.10"
base64 = "0.22"
rand = "0.8"
hex = "0.4"
crc32fast = "1"

# Misc
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
once_cell = "1"
async-trait = "0.1"
futures = "0.3"
parking_lot = "0.12"
regex = "1"
scraper = "0.20"
ego-tree = "0.6"
pulldown-cmark = "0.12"
uuid = { version = "1", features = ["v4", "serde"] }
dirs = "5"

# P2P sync (iroh transport + Loro CRDT). Behind the `p2p` feature flag.
# See tauri/docs/sync/design.md and tickets.md. Versions are exact pins per
# Phase 0 kickoff: change deliberately, not via cargo update.
iroh = "=0.98.2"
iroh-gossip = "=0.98.0"
iroh-base = "=0.98.0"
loro = "=1.12.0"
qrcode = "=0.14.1"
image = "=0.25.10"
blake3 = "=1.8.5"
postcard = "=1.1.3"
zeroize = "=1.8.2"
# OS keychain for sync_doc_secret + iroh_node_secret (T-021).
# `apple-native` (Keychain), `windows-native` (Credential Manager),
# `linux-native` (kernel keyutils — works without DBus). SQLite
# app_state stays as a fallback for systems where the keyring isn't
# available (headless Linux without keyutils, sandboxed kiosks).
# Pinned at the 3.x line because 4.0 reorganises platform crates and
# requires Rust 1.88.
keyring = { version = "=3.6.3", features = ["apple-native", "windows-native", "linux-native"], optional = true }

# Mobile-only: native camera-based QR scanner used by Settings → Sync to
# pair devices. Desktop builds fall back to the existing manual paste box.
[target.'cfg(any(target_os = "ios", target_os = "android"))'.dependencies]
tauri-plugin-barcode-scanner = "2"

# OTA self-update — desktop only. Mobile updates through the App Store / TestFlight.
[target.'cfg(not(any(target_os = "ios", target_os = "android")))'.dependencies]
tauri-plugin-updater = "2"

[dev-dependencies]
# Used by p2p::persistence integration tests for ephemeral data dirs.
tempfile = "=3.14.0"
# Test-only iroh feature: pulls in `iroh::test_utils::run_relay_server`
# and the relay server impl needed by `p2p::transport` integration tests.
# Cargo's feature unification adds these only at test time.
iroh = { version = "=0.98.2", features = ["test-utils"] }

[profile.release]
debug = false
strip = "symbols"
lto = "thin"
codegen-units = 1
panic = "abort"

[features]
default = ["custom-protocol", "p2p"]
custom-protocol = ["tauri/custom-protocol"]
# P2P device-to-device sync. On by default during development; flip off
# (or split deps into optional) once we want a smaller no-network build.
p2p = ["dep:keyring"]
