name: Build and Release

on:
  push:
    branches:
      - release

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    environment: production

    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Import Apple Certificates
        if: matrix.os == 'macos-14'
        env:
          CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          P12_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_P12_PASSWORD }}
          K_PASS: "buildpassword123"
        run: |
          # Use a unique name for the keychain
          KEYCHAIN="build_action.keychain"
          
          echo "Checking secret availability..."
          if [ -z "$CERTIFICATE_P12" ]; then
            echo "::error::APPLE_CERTIFICATE_P12 is empty! Check GitHub Repo Secrets."
            exit 1
          fi
          if [ -z "$P12_PASSWORD" ]; then
            echo "::error::APPLE_CERTIFICATE_P12_PASSWORD is empty! Check GitHub Repo Secrets."
            exit 1
          fi

          # Decode secret into p12 file - tr -d removes any accidental whitespace/newlines
          echo "$CERTIFICATE_P12" | tr -d '\n ' | base64 --decode > certificate.p12
          
          if [ ! -s certificate.p12 ]; then
            echo "::error::certificate.p12 decoding resulted in an empty file."
            exit 1
          fi

          security create-keychain -p "$K_PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$K_PASS" "$KEYCHAIN"
          
          # Import with -P for the P12 password and -k for the target keychain
          security import certificate.p12 -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productsign
          
          # Fix the search list to include the new keychain
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | xargs)
          
          # Critical for macOS 10.12+: allow the partition to be accessed by code signing
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$K_PASS" "$KEYCHAIN"
          
          rm -f certificate.p12

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Ruby (System)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'

      - name: Setup and Sign Native Dependencies (macOS)
        if: matrix.os == 'macos-14'
        run: |
          set -e
          set -x
          
          # 1. Provision portable ruby
          mkdir -p bin/ruby_dist/macos-arm64
          URL="https://github.com/ruby/ruby-builder/releases/download/ruby-3.4.1/ruby-3.4.1-darwin-arm64.tar.gz"
          curl -L "$URL" | tar -xz -C bin/ruby_dist/macos-arm64 --strip-components=1
          
          # Clean up any extended attributes
          xattr -cr bin/ruby_dist/macos-arm64
          
          PORTABLE_RUBY_DIR="$(pwd)/bin/ruby_dist/macos-arm64"
          PORTABLE_RUBY_BIN="$PORTABLE_RUBY_DIR/bin/ruby"
          LIB_DEST="$PORTABLE_RUBY_DIR/lib"
          
          # 2. Initial Patching: Make Ruby executable on the runner
          # Standard ruby-builder builds use absolute paths or relative paths that might not match
          echo "Applying initial patches to Ruby binary..."
          chmod +w "$PORTABLE_RUBY_BIN"
          codesign --remove-signature "$PORTABLE_RUBY_BIN" || true
          
          # Find and fix libruby link in the main binary
          CURRENT_LIBRUBY=$(otool -L "$PORTABLE_RUBY_BIN" | grep libruby | awk '{print $1}' | head -n 1)
          if [ ! -z "$CURRENT_LIBRUBY" ]; then
             # Add rpath for the standard location and patch link
             install_name_tool -add_rpath "@executable_path/../lib" "$PORTABLE_RUBY_BIN" || true
             install_name_tool -change "$CURRENT_LIBRUBY" "@rpath/$(basename "$CURRENT_LIBRUBY")" "$PORTABLE_RUBY_BIN" || true
          fi

          # Patch the dylibs themselves
          find "$LIB_DEST" -name "*.dylib" | while read -r dylib; do
            chmod +w "$dylib"
            codesign --remove-signature "$dylib" || true
            install_name_tool -id "@rpath/$(basename "$dylib")" "$dylib" || true
            
            # Fix cross-links (e.g. libruby linking to libgmp)
            otool -L "$dylib" | grep -E "/opt/homebrew|/usr/local" | awk '{print $1}' | while read -r dep; do
              install_name_tool -change "$dep" "@rpath/$(basename "$dep")" "$dylib" || true
            done
          done

          # 3. Provision external dependencies (libgmp, libyaml) 
          # These are often required by Ruby but not bundled in the builder tarball
          echo "Bundling missing dependencies..."
          # Use 'brew --prefix' to find libs, then copy to our lib folder
          GMP_PATH=$(brew --prefix gmp 2>/dev/null)/lib/libgmp.10.dylib || true
          if [ -f "$GMP_PATH" ]; then
            cp "$GMP_PATH" "$LIB_DEST/"
            chmod 644 "$LIB_DEST/libgmp.10.dylib"
            install_name_tool -id "@rpath/libgmp.10.dylib" "$LIB_DEST/libgmp.10.dylib" || true
          fi
          
          YAML_PATH=$(brew --prefix libyaml 2>/dev/null)/lib/libyaml-0.2.dylib || true
          if [ -f "$YAML_PATH" ]; then
            cp "$YAML_PATH" "$LIB_DEST/"
            chmod 644 "$LIB_DEST/libyaml-0.2.dylib"
            install_name_tool -id "@rpath/libyaml-0.2.dylib" "$LIB_DEST/libyaml-0.2.dylib" || true
          fi
          
          # 4. Preparation for execution and Gem installation
          # We'll use DYLD_LIBRARY_PATH temporarily during building to be safe
          export DYLD_LIBRARY_PATH="$LIB_DEST:$DYLD_LIBRARY_PATH"
          export PATH="$PORTABLE_RUBY_DIR/bin:$PATH"
          
          echo "Ruby binary linkage after initial patch:"
          otool -L "$PORTABLE_RUBY_BIN"
          
          # Smoke test
          "$PORTABLE_RUBY_BIN" -v

          echo "Installing bundler..."
          "$PORTABLE_RUBY_BIN" -S gem install bundler --no-document
          
          echo "Installing Gems via portable ruby..."
          "$PORTABLE_RUBY_BIN" -S bundle config set --local path 'vendor/bundle'
          "$PORTABLE_RUBY_BIN" -S bundle config set --local deployment 'true'
          "$PORTABLE_RUBY_BIN" -S bundle install
          
          xattr -cr vendor/bundle

          # 5. Deep Repair for Perfect Portability
          echo "Repairing load paths for all native extensions and binaries..."
          
          # Define repair function
          repair_binary() {
            local f="$1"
            local lib_folder="$2"
            echo "Repairing load paths in: $f"
            
            # Make writable and remove signature
            chmod +w "$f" 2>/dev/null || true
            codesign --remove-signature "$f" 2>/dev/null || true
            
            # 1. Add rpaths covering various depths to find /lib relatively
            # These levels allow gems deep in vendor/bundle to find bin/ruby_dist/.../lib
            # by traversing up and then back down.
            for depth in {1..12}; do
              prefix=$(printf '../%.0s' $(seq 1 $depth))
              # Try to find lib relative to sidecar root (bin/ruby_dist/macos-arm64/lib)
              install_name_tool -add_rpath "@loader_path/${prefix}bin/ruby_dist/macos-arm64/lib" "$f" 2>/dev/null || true
              install_name_tool -add_rpath "@loader_path/${prefix}lib" "$f" 2>/dev/null || true
            done
            
            # 2. Patch hardcoded Homebrew/system paths to use @rpath
            otool -L "$f" 2>/dev/null | grep -E "/opt/homebrew|/usr/local" | awk '{print $1}' | while read -r dep; do
              local base=$(basename "$dep")
              # If we have this dependency bundled in lib/
              if [ -f "$lib_folder/$base" ]; then
                echo "  -> Linked $base to @rpath"
                install_name_tool -change "$dep" "@rpath/$base" "$f" 2>/dev/null || true
              fi
            done
            
            # 3. Handle libruby specially (patch to @rpath)
            local current_libruby=$(otool -L "$f" 2>/dev/null | grep libruby | awk '{print $1}' | head -n 1)
            if [ ! -z "$current_libruby" ]; then
               install_name_tool -change "$current_libruby" "@rpath/$(basename "$current_libruby")" "$f" 2>/dev/null || true
            fi
          }

          # Export for find's child shells
          export -f repair_binary
          # Optimized find - search for Mach-O files explicitly
          find bin/ruby_dist vendor/bundle -type f \( -name "*.dylib" -o -name "*.bundle" -o -name "*.so" -o -perm +111 \) -exec bash -c 'file "$0" | grep -q "Mach-O" && repair_binary "$0" "$1"' {} "$LIB_DEST" \;

          # Final check: ensure all bundled dylibs in lib/ have correct internal ID (again)
          find "$LIB_DEST" -name "*.dylib" | while read -r dylib; do
            install_name_tool -id "@rpath/$(basename "$dylib")" "$dylib" 2>/dev/null || true
          done

          # 6. Verification Check (No DYLD environment help)
          echo "Running final portability test..."
          DYLD_LIBRARY_PATH="" "$PORTABLE_RUBY_BIN" -v
          export GEM_PATH="$(pwd)/vendor/bundle/ruby/3.4.0:$(pwd)/bin/ruby_dist/macos-arm64/lib/ruby/gems/3.4.0"
          DYLD_LIBRARY_PATH="" "$PORTABLE_RUBY_BIN" -e "require 'sqlite3'; puts '✅ native gems load without DYLD_LIBRARY_PATH'"

          # 7. Code Signing for Hardened Runtime
          IDENTITY="${{ secrets.APPLE_DEVELOPER_IDENTITY }}"
          ENTITLEMENTS="build/entitlements.mac.plist"
          
          echo "Signing native components using identity: $IDENTITY"
          
          # Sign all bundles/dylibs first
          find vendor/bundle bin/ruby_dist/macos-arm64 -type f \( -name "*.dylib" -o -name "*.bundle" -o -name "*.so" \) | while read -r file; do
             codesign --force --options runtime --timestamp -s "$IDENTITY" "$file"
          done
          
          # Sign main Ruby executable last with entitlements
          codesign --force --options runtime --timestamp --entitlements "$ENTITLEMENTS" -s "$IDENTITY" "$PORTABLE_RUBY_BIN"
          
          # Verification
          echo "Final signature check..."
          codesign -vvv --deep --strict "$PORTABLE_RUBY_BIN"

          echo "macOS native dependencies setup complete."

      - name: Setup Native Dependencies (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          set -e
          set -x
          mkdir -p bin/ruby_dist/win-x64
          # Provision portable ruby
          URL="https://github.com/oneclick/rubyinstaller2/releases/download/RubyInstaller-3.4.1-1/rubyinstaller-3.4.1-1-x64.7z"
          curl -L "$URL" -o ruby.7z
          7z x ruby.7z -obin/ruby_dist/win-x64
          # Re-root the portable folder

          if [ -d bin/ruby_dist/win-x64/rubyinstaller-3.4.1-1-x64 ]; then
            mv bin/ruby_dist/win-x64/rubyinstaller-3.4.1-1-x64/* bin/ruby_dist/win-x64/
          fi
          
          # Install gems into vendor folder using system ruby (setup-ruby)
          bundle config set --local path 'vendor/bundle'
          bundle install --deployment || bundle install

      - name: Install Dependencies
        run: npm ci

      - name: Build Electron App
        run: npm run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Use CSC_LINK and CSC_KEY_PASSWORD for more reliable CI signing
          CSC_LINK: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          CSC_KEY_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_P12_PASSWORD }}

      - name: List Build Output
        run: ls -R dist/

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.os }}
          path: |
            dist/*.dmg
            dist/*.exe
            dist/*.zip
            dist/*.blockmap
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Get version from package.json
        id: pkg_version
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          tag_name: v${{ steps.pkg_version.outputs.version }}
          name: Brilliant v${{ steps.pkg_version.outputs.version }}
          draft: false
          prerelease: false
          body: |
            ## Brilliant Release v${{ steps.pkg_version.outputs.version }}
            
            ###  macOS Update
            This build is now **Properly Signed and Notarized** with a valid Apple Developer Certificate. 
            It should open directly on Apple Silicon and Intel Macs without "Damaged" or Gatekeeper warnings.
            
            ---
            *Automated build from release branch.*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
