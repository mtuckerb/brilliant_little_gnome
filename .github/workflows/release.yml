name: Build and Release

on:
  push:
    branches:
      - release

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [macos-latest, windows-latest]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'

      - name: Setup Native Dependencies (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          mkdir -p bin/ruby_dist/macos-arm64
          # Provision portable ruby
          curl -L https://github.com/ruby/ruby-builder/releases/download/ruby-3.4.1/ruby-3.4.1-darwin-arm64.tar.gz | tar -xz -C bin/ruby_dist/macos-arm64 --strip-components=1
          
          # Fix rpath for portability
          BINARY="bin/ruby_dist/macos-arm64/bin/ruby"
          CURRENT_LIB=$(otool -L "$BINARY" | grep libruby | awk '{print $1}')
          if [ ! -z "$CURRENT_LIB" ]; then
            install_name_tool -change "$CURRENT_LIB" "@executable_path/../lib/libruby.3.4.dylib" "$BINARY"
          fi

          export DYLD_LIBRARY_PATH="$PWD/bin/ruby_dist/macos-arm64/lib"
          bundle config set --local path 'vendor/bundle'
          bin/ruby_dist/macos-arm64/bin/ruby bin/ruby_dist/macos-arm64/bin/bundle install

      - name: Setup Native Dependencies (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          mkdir -p bin/ruby_dist/win-x64
          # Provision portable ruby
          curl -L https://github.com/oneclick/rubyinstaller2/releases/download/RubyInstaller-3.4.1-1/rubyinstaller-3.4.1-1-x64.7z -o ruby.7z
          7z x ruby.7z -obin/ruby_dist/win-x64
          # Re-root the portable folder
          mv bin/ruby_dist/win-x64/rubyinstaller-3.4.1-1-x64/* bin/ruby_dist/win-x64/ || true
          # Use the portable ruby to install native gems
          bin/ruby_dist/win-x64/bin/ruby bin/ruby_dist/win-x64/bin/bundle.bat install

      - name: Install Dependencies
        run: npm ci

      - name: Build Electron App
        run: npm run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.os }}
          path: dist/*.{dmg,exe,zip}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/build-macos-latest/*.dmg
            artifacts/build-macos-latest/*.zip
            artifacts/build-windows-latest/*.exe
            artifacts/build-windows-latest/*.zip
          tag_name: v${{ github.run_number }}
          name: Release v${{ github.run_number }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
