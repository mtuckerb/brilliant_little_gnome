name: Build and Release

on:
  push:
    branches:
      - release

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Ruby (System)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'

      - name: Setup Native Dependencies (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          mkdir -p bin/ruby_dist/macos-arm64
          # Provision portable ruby
          curl -L https://github.com/ruby/ruby-builder/releases/download/ruby-3.4.1/ruby-3.4.1-darwin-arm64.tar.gz | tar -xz -C bin/ruby_dist/macos-arm64 --strip-components=1
          
          # Fix rpath for portability
          RB_BIN="bin/ruby_dist/macos-arm64/bin/ruby"
          RB_LIB="bin/ruby_dist/macos-arm64/lib/libruby.3.4.dylib"
          
          # Check files exist
          ls -l "$RB_BIN" || exit 1
          ls -l "$RB_LIB" || exit 1
          
          # Make library and binary relocatable
          install_name_tool -id "@rpath/libruby.3.4.dylib" "$RB_LIB" || true
          OLD_LIB=$(otool -L "$RB_BIN" | grep libruby | awk '{print $1}' | head -n 1)
          echo "Old Lib Path: $OLD_LIB"
          install_name_tool -change "$OLD_LIB" "@rpath/libruby.3.4.dylib" "$RB_BIN" || true
          install_name_tool -add_rpath "@executable_path/../lib" "$RB_BIN" || true

          # Re-sign for ARM64 macOS
          codesign -s - -f "$RB_LIB" || true
          codesign -s - -f "$RB_BIN" || true

          # Set environment for portable ruby
          export PATH="$PWD/bin/ruby_dist/macos-arm64/bin:$PATH"
          export GEM_HOME="$PWD/vendor/bundle"
          export GEM_PATH="$PWD/vendor/bundle"
          
          # Install bundler inside our portable ruby
          "$RB_BIN" -S gem install bundler --no-document
          # Install dependencies
          "$RB_BIN" -S bundle install --path vendor/bundle

      - name: Setup Native Dependencies (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          mkdir -p bin/ruby_dist/win-x64
          # Provision portable ruby
          curl -L https://github.com/oneclick/rubyinstaller2/releases/download/RubyInstaller-3.4.1-1/rubyinstaller-3.4.1-1-x64.7z -o ruby.7z
          7z x ruby.7z -obin/ruby_dist/win-x64
          # Re-root the portable folder
          mv bin/ruby_dist/win-x64/rubyinstaller-3.4.1-1-x64/* bin/ruby_dist/win-x64/ || true
          
          # Set environment for portable ruby
          $env:PATH = "$PWD\bin\ruby_dist\win-x64\bin;$env:PATH"
          $env:GEM_HOME = "$PWD\vendor\bundle"
          $env:GEM_PATH = "$PWD\vendor\bundle"
          
          # Use binary path explicitly
          $RB_BIN = "bin/ruby_dist/win-x64/bin/ruby.exe"
          
          # Install dependencies
          & $RB_BIN -S gem install bundler --no-document
          & $RB_BIN -S bundle install --path vendor/bundle

      - name: Install Dependencies
        run: npm ci

      - name: Build Electron App
        run: npm run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.os }}
          path: dist/*.{dmg,exe,zip}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/build-macos-latest/*.dmg
            artifacts/build-macos-latest/*.zip
            artifacts/build-windows-latest/*.exe
            artifacts/build-windows-latest/*.zip
          tag_name: v${{ github.run_number }}
          name: Release v${{ github.run_number }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
