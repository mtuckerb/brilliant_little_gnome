name: Build and Release

on:
  push:
    branches:
      - release

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    environment: production

    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Import Apple Certificates
        if: matrix.os == 'macos-14'
        env:
          CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          P12_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_P12_PASSWORD }}
          K_PASS: "buildpassword123"
        run: |
          # Use a unique name for the keychain
          KEYCHAIN="build_action.keychain"
          
          echo "Checking secret availability..."
          if [ -z "$CERTIFICATE_P12" ]; then
            echo "::error::APPLE_CERTIFICATE_P12 is empty! Check GitHub Repo Secrets."
            exit 1
          fi
          if [ -z "$P12_PASSWORD" ]; then
            echo "::error::APPLE_CERTIFICATE_P12_PASSWORD is empty! Check GitHub Repo Secrets."
            exit 1
          fi

          # Decode secret into p12 file - tr -d removes any accidental whitespace/newlines
          echo "$CERTIFICATE_P12" | tr -d '\n ' | base64 --decode > certificate.p12
          
          if [ ! -s certificate.p12 ]; then
            echo "::error::certificate.p12 decoding resulted in an empty file."
            exit 1
          fi

          security create-keychain -p "$K_PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$K_PASS" "$KEYCHAIN"
          
          # Import with -P for the P12 password and -k for the target keychain
          security import certificate.p12 -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productsign
          
          # Fix the search list to include the new keychain
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | xargs)
          
          # Critical for macOS 10.12+: allow the partition to be accessed by code signing
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$K_PASS" "$KEYCHAIN"
          
          rm -f certificate.p12

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Ruby (System)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'

      - name: Setup and Sign Native Dependencies (macOS)
        if: matrix.os == 'macos-14'
        run: |
          set -e
          set -x
          
          # 1. Provision portable ruby
          mkdir -p bin/ruby_dist/macos-arm64
          URL="https://github.com/ruby/ruby-builder/releases/download/ruby-3.4.1/ruby-3.4.1-darwin-arm64.tar.gz"
          curl -L "$URL" | tar -xz -C bin/ruby_dist/macos-arm64 --strip-components=1
          
          # Clean up any extended attributes
          xattr -cr bin/ruby_dist/macos-arm64
          
          PORTABLE_RUBY_BIN="$(pwd)/bin/ruby_dist/macos-arm64/bin/ruby"
          PORTABLE_RUBY_DIR="$(pwd)/bin/ruby_dist/macos-arm64"
          LIB_DEST="$PORTABLE_RUBY_DIR/lib"

          # CRITICAL: Fix the ruby binary signature and links immediately
          echo "Unsigning and patching Ruby binary for build runner..."
          chmod +w "$PORTABLE_RUBY_BIN"
          codesign --remove-signature "$PORTABLE_RUBY_BIN" || true
          
          # Map libruby to a relative path
          OLD_LIBRUBY=$(otool -L "$PORTABLE_RUBY_BIN" | grep libruby | awk '{print $1}' | head -n 1)
          if [ ! -z "$OLD_LIBRUBY" ]; then
             echo "Changing $OLD_LIBRUBY to @loader_path/../lib/libruby.3.4.dylib"
             install_name_tool -change "$OLD_LIBRUBY" "@loader_path/../lib/libruby.3.4.dylib" "$PORTABLE_RUBY_BIN"
          fi
          install_name_tool -add_rpath "@loader_path/../lib" "$PORTABLE_RUBY_BIN" || true
          
          # 2. Add portable ruby to path and install gems
          export PATH="$PORTABLE_RUBY_DIR/bin:$PATH"
          export DYLD_LIBRARY_PATH="$LIB_DEST:$DYLD_LIBRARY_PATH"
          
          # Ensure bundler is present in the portable ruby
          "$PORTABLE_RUBY_BIN" -S gem install bundler --no-document
          
          # Install gems into the workspace
          bundle config set --local path 'vendor/bundle'
          bundle config set --local deployment 'true'
          bundle install
          
          # Clean up gem extended attributes
          xattr -cr vendor/bundle

          # 3. Handle external dependencies (libgmp, libyaml)
          echo "Bundling missing dependencies into portable lib/ folder..."
          
          GMP_PATH=$(brew --prefix gmp)/lib/libgmp.10.dylib
          if [ -f "$GMP_PATH" ]; then
            cp "$GMP_PATH" "$LIB_DEST/"
            chmod 644 "$LIB_DEST/libgmp.10.dylib"
            install_name_tool -id "@rpath/libgmp.10.dylib" "$LIB_DEST/libgmp.10.dylib"
          fi
          
          YAML_PATH=$(brew --prefix libyaml)/lib/libyaml-0.2.dylib
          if [ -f "$YAML_PATH" ]; then
            cp "$YAML_PATH" "$LIB_DEST/"
            chmod 644 "$LIB_DEST/libyaml-0.2.dylib"
            install_name_tool -id "@rpath/libyaml-0.2.dylib" "$LIB_DEST/libyaml-0.2.dylib"
          fi

          # 4. Patch all native components
          echo "Applying robust RPath strategy..."
          
          # Patch search paths for EVERYTHING
          find bin/ruby_dist/macos-arm64 vendor/bundle -type f \( -perm +111 -o -name "*.dylib" -o -name "*.bundle" -o -name "*.so" \) | while read -r target; do
            codesign --remove-signature "$target" 2>/dev/null || true
            chmod +w "$target" 2>/dev/null || true
            
            # Universal relative library search path
            install_name_tool -add_rpath "@loader_path/../lib" "$target" 2>/dev/null || true
            install_name_tool -add_rpath "@loader_path/../../lib" "$target" 2>/dev/null || true
            install_name_tool -add_rpath "@loader_path/../../../lib" "$target" 2>/dev/null || true
            install_name_tool -add_rpath "@loader_path/../../../../lib" "$target" 2>/dev/null || true
            install_name_tool -add_rpath "@loader_path/../../../../../lib" "$target" 2>/dev/null || true
            install_name_tool -add_rpath "@loader_path/../../../../../../lib" "$target" 2>/dev/null || true
            
            # Switch any hardcoded brew paths to @rpath
            otool -L "$target" 2>/dev/null | grep -E "/opt/homebrew|/usr/local" | awk '{print $1}' | while read -r dep; do
              dep_base=$(basename "$dep")
              if [ -f "$LIB_DEST/$dep_base" ]; then
                install_name_tool -change "$dep" "@rpath/$dep_base" "$target" 2>/dev/null || true
              fi
            done
            
            # Standardize libruby path
            CUR_LIBRUBY=$(otool -L "$target" 2>/dev/null | grep libruby | awk '{print $1}' | head -n 1)
            if [ ! -z "$CUR_LIBRUBY" ]; then
               install_name_tool -change "$CUR_LIBRUBY" "@rpath/$(basename "$CUR_LIBRUBY")" "$target" 2>/dev/null || true
            fi
          done

          # 5. Runtime Verification
          echo "Verifying portable Ruby environment..."
          "$PORTABLE_RUBY_BIN" -v
          export GEM_PATH="$(pwd)/vendor/bundle/ruby/3.4.0:$(pwd)/bin/ruby_dist/macos-arm64/lib/ruby/gems/3.4.0"
          "$PORTABLE_RUBY_BIN" -e "require 'sqlite3'; puts '✅ sqlite3 loaded'"

          # 6. Final Code Signing for Hardened Runtime
          IDENTITY="${{ secrets.APPLE_DEVELOPER_IDENTITY }}"
          ENTITLEMENTS="build/entitlements.mac.plist"
          
          echo "Signing native components using identity: $IDENTITY"
          
          # Sign bundles/dylibs (bottom-up)
          find vendor/bundle bin/ruby_dist/macos-arm64 -type f \( -name "*.dylib" -o -name "*.bundle" -o -name "*.so" \) | while read -r file; do
             codesign --force --options runtime --timestamp -s "$IDENTITY" "$file"
          done
          
          # Sign main Ruby executable with entitlements
          codesign --force --options runtime --timestamp --entitlements "$ENTITLEMENTS" -s "$IDENTITY" "$PORTABLE_RUBY_BIN"
          
          # Verify
          echo "Verifying Ruby signature..."
          codesign -vvv --deep --strict "$PORTABLE_RUBY_BIN"

          echo "Native dependencies completed successfully."

      - name: Setup Native Dependencies (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          set -e
          set -x
          mkdir -p bin/ruby_dist/win-x64
          # Provision portable ruby
          URL="https://github.com/oneclick/rubyinstaller2/releases/download/RubyInstaller-3.4.1-1/rubyinstaller-3.4.1-1-x64.7z"
          curl -L "$URL" -o ruby.7z
          7z x ruby.7z -obin/ruby_dist/win-x64
          # Re-root the portable folder

          if [ -d bin/ruby_dist/win-x64/rubyinstaller-3.4.1-1-x64 ]; then
            mv bin/ruby_dist/win-x64/rubyinstaller-3.4.1-1-x64/* bin/ruby_dist/win-x64/
          fi
          
          # Install gems into vendor folder using system ruby (setup-ruby)
          bundle config set --local path 'vendor/bundle'
          bundle install --deployment || bundle install

      - name: Install Dependencies
        run: npm ci

      - name: Build Electron App
        run: npm run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Use CSC_LINK and CSC_KEY_PASSWORD for more reliable CI signing
          CSC_LINK: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          CSC_KEY_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_P12_PASSWORD }}

      - name: List Build Output
        run: ls -R dist/

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.os }}
          path: |
            dist/*.dmg
            dist/*.exe
            dist/*.zip
            dist/*.blockmap
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Get version from package.json
        id: pkg_version
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          tag_name: v${{ steps.pkg_version.outputs.version }}
          name: Brilliant v${{ steps.pkg_version.outputs.version }}
          draft: false
          prerelease: false
          body: |
            ## Brilliant Release v${{ steps.pkg_version.outputs.version }}
            
            ###  macOS Update
            This build is now **Properly Signed and Notarized** with a valid Apple Developer Certificate. 
            It should open directly on Apple Silicon and Intel Macs without "Damaged" or Gatekeeper warnings.
            
            ---
            *Automated build from release branch.*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
