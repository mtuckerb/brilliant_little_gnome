name: Build and Release

on:
  push:
    branches:
      - release

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    environment: production

    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Import Apple Certificates
        if: matrix.os == 'macos-14'
        env:
          CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          P12_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_P12_PASSWORD }}
          K_PASS: "buildpassword123"
        run: |
          KEYCHAIN="build_action.keychain"
          echo "$CERTIFICATE_P12" | tr -d '\n ' | base64 --decode > certificate.p12
          security create-keychain -p "$K_PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$K_PASS" "$KEYCHAIN"
          security import certificate.p12 -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productsign
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | xargs)
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$K_PASS" "$KEYCHAIN"
          rm -f certificate.p12

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Ruby (System)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'

      - name: Setup and Sign Native Dependencies (macOS)
        if: matrix.os == 'macos-14'
        shell: bash
        run: |
          set -e
          
          # 1. Unpack Portable Ruby
          mkdir -p bin/ruby_dist/macos-arm64
          URL="https://github.com/ruby/ruby-builder/releases/download/ruby-3.4.1/ruby-3.4.1-darwin-arm64.tar.gz"
          curl -L "$URL" | tar -xz -C bin/ruby_dist/macos-arm64 --strip-components=1
          xattr -cr bin/ruby_dist/macos-arm64 || true
          
          PORTABLE_DIR="$(pwd)/bin/ruby_dist/macos-arm64"
          RUBY_BIN="$PORTABLE_DIR/bin/ruby"
          LIB_DIR="$PORTABLE_DIR/lib"
          
          # 2. Fix Ruby Binary
          chmod +w "$RUBY_BIN"
          codesign --remove-signature "$RUBY_BIN" || true
          install_name_tool -add_rpath "@executable_path/../lib" "$RUBY_BIN" || true
          
          LIBRUBY_PATH=$(otool -L "$RUBY_BIN" | grep libruby | awk '{print $1}' | head -n 1) || true
          if [ -n "$LIBRUBY_PATH" ]; then
            install_name_tool -change "$LIBRUBY_PATH" "@rpath/$(basename $LIBRUBY_PATH)" "$RUBY_BIN" || true
          fi
          
          # Fix dylibs in lib/
          find "$LIB_DIR" -name "*.dylib" -maxdepth 1 -type f | while read -r dylib; do
            chmod +w "$dylib"
            codesign --remove-signature "$dylib" || true
            install_name_tool -id "@rpath/$(basename "$dylib")" "$dylib" || true
          done

          # 3. Handle External Dependencies (GMP, YAML)
          for dep in gmp libyaml; do
            DPATH=$(brew --prefix $dep 2>/dev/null)/lib
            if [ -d "$DPATH" ]; then
              find "$DPATH" -name "*.dylib" -maxdepth 1 -type f | while read -r src; do
                base=$(basename "$src")
                cp "$src" "$LIB_DIR/"
                chmod 644 "$LIB_DIR/$base"
                install_name_tool -id "@rpath/$base" "$LIB_DIR/$base" || true
              done
            fi
          done

          # 4. Gem Installation
          export PATH="$PORTABLE_DIR/bin:$PATH"
          export DYLD_LIBRARY_PATH="$LIB_DIR"
          gem install bundler --no-document
          bundle config set --local path 'vendor/bundle'
          bundle config set --local deployment 'true'
          bundle install
          xattr -cr vendor/bundle || true

          # 5. Recursive RPath Patching
          # Inline the repair function to avoid export -f issues (which might cause code 126 in some shells)
          find bin/ruby_dist/macos-arm64 vendor/bundle -type f \( -name "*.dylib" -o -name "*.bundle" -o -name "*.so" -o -perm +111 \) | while read -r f; do
            if file "$f" | grep -q "Mach-O"; then
              echo "Repairing $f"
              chmod +w "$f" 2>/dev/null || true
              codesign --remove-signature "$f" 2>/dev/null || true
              
              # Unified rpaths covering extension depths
              for depth in $(seq 3 10); do
                up=""
                for i in $(seq 1 $depth); do up+="../"; done
                install_name_tool -add_rpath "@loader_path/${up}bin/ruby_dist/macos-arm64/lib" "$f" 2>/dev/null || true
                install_name_tool -add_rpath "@loader_path/${up}lib" "$f" 2>/dev/null || true
              done
              install_name_tool -add_rpath "@loader_path/../lib" "$f" 2>/dev/null || true

              # Link hardcoded runner paths to @rpath
              otool -L "$f" 2>/dev/null | grep -E "/opt/homebrew|/usr/local" | awk '{print $1}' | while read -r dep; do
                base=$(basename "$dep")
                if [ -f "$LIB_DIR/$base" ]; then
                  install_name_tool -change "$dep" "@rpath/$base" "$f" 2>/dev/null || true
                fi
              done
              
              # Ruby link
              cur_rb=$(otool -L "$f" 2>/dev/null | grep libruby | awk '{print $1}' | head -n 1) || true
              if [ -n "$cur_rb" ]; then
                 install_name_tool -change "$cur_rb" "@rpath/$(basename "$cur_rb")" "$f" 2>/dev/null || true
              fi
              codesign -s - "$f" 2>/dev/null || true
            fi
          done

          # 6. Verify
          unset DYLD_LIBRARY_PATH
          ruby -v
          export GEM_PATH="$(pwd)/vendor/bundle/ruby/3.4.0:$PORTABLE_DIR/lib/ruby/gems/3.4.0"
          ruby -e "require 'sqlite3'; puts 'SUCCESS: sqlite3 loaded'"

          # 7. production Sign
          IDENTITY="${{ secrets.APPLE_DEVELOPER_IDENTITY }}"
          ENTITLEMENTS="build/entitlements.mac.plist"
          if [ -n "$IDENTITY" ]; then
            find vendor/bundle bin/ruby_dist/macos-arm64 -type f \( -name "*.dylib" -o -name "*.bundle" -o -name "*.so" \) | while read -r file; do
               codesign --force --options runtime --timestamp -s "$IDENTITY" "$file"
            done
            codesign --force --options runtime --timestamp --entitlements "$ENTITLEMENTS" -s "$IDENTITY" "$RUBY_BIN"
            codesign -vvv --deep --strict "$RUBY_BIN"
          fi

      - name: Setup Native Dependencies (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          set -e
          mkdir -p bin/ruby_dist/win-x64
          URL="https://github.com/oneclick/rubyinstaller2/releases/download/RubyInstaller-3.4.1-1/rubyinstaller-3.4.1-1-x64.7z"
          curl -L "$URL" -o ruby.7z
          7z x ruby.7z -obin/ruby_dist/win-x64
          if [ -d bin/ruby_dist/win-x64/rubyinstaller-3.4.1-1-x64 ]; then
            mv bin/ruby_dist/win-x64/rubyinstaller-3.4.1-1-x64/* bin/ruby_dist/win-x64/
          fi
          bundle config set --local path 'vendor/bundle'
          bundle install --deployment || bundle install

      - name: Install Dependencies
        run: npm ci

      - name: Build Electron App
        run: npm run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CSC_LINK: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          CSC_KEY_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_P12_PASSWORD }}

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.os }}
          path: |
            dist/*.dmg
            dist/*.exe
            dist/*.zip
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Get version from package.json
        id: pkg_version
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          tag_name: v${{ steps.pkg_version.outputs.version }}
          name: Brilliant v${{ steps.pkg_version.outputs.version }}
          body: |
            ## Brilliant v${{ steps.pkg_version.outputs.version }}
            Signed and Notarized production build.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
