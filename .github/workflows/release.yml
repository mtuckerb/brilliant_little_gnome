name: Build and Release

on:
  push:
    branches:
      - release

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    environment: production

    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Import Apple Certificates
        if: matrix.os == 'macos-14'
        env:
          CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          P12_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_P12_PASSWORD }}
          K_PASS: "buildpassword123"
        run: |
          KEYCHAIN="build_action.keychain"
          echo "$CERTIFICATE_P12" | tr -d '\n ' | base64 --decode > certificate.p12
          security create-keychain -p "$K_PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$K_PASS" "$KEYCHAIN"
          security import certificate.p12 -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productsign
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | xargs)
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$K_PASS" "$KEYCHAIN"
          rm -f certificate.p12

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Ruby (System)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'

      - name: Setup and Sign Native Dependencies (macOS)
        if: matrix.os == 'macos-14'
        shell: bash
        run: |
          set -e
          echo "Starting macOS Native Setup..."
          
          # 1. Unpack Portable Ruby
          mkdir -p bin/ruby_dist/macos-arm64
          URL="https://github.com/ruby/ruby-builder/releases/download/ruby-3.4.1/ruby-3.4.1-darwin-arm64.tar.gz"
          curl -L "$URL" | tar -xz -C bin/ruby_dist/macos-arm64 --strip-components=1
          
          PORTABLE_DIR="$(pwd)/bin/ruby_dist/macos-arm64"
          RUBY_BIN="$PORTABLE_DIR/bin/ruby"
          LIB_DIR="$PORTABLE_DIR/lib"
          
          chmod -R +w "$PORTABLE_DIR"
          chmod +x "$RUBY_BIN"
          xattr -cr "$PORTABLE_DIR" || true

          # 2. Identify and Bundle Dependencies
          echo "Bundling dependencies..."
          mkdir -p "$LIB_DIR"
          
          # Bundle libruby
          L_SRC=$(find "$PORTABLE_DIR" -name "libruby.3.4.dylib" | head -n 1) || true
          if [ -n "$L_SRC" ] && [ "$L_SRC" != "$LIB_DIR/libruby.3.4.dylib" ]; then
             echo "Copying $L_SRC to $LIB_DIR"
             cp "$L_SRC" "$LIB_DIR/"
          fi
          
          if [ -f "$LIB_DIR/libruby.3.4.dylib" ] || [ -L "$LIB_DIR/libruby.3.4.dylib" ]; then
             chmod +w "$LIB_DIR/libruby.3.4.dylib" || true
             install_name_tool -id "@rpath/libruby.3.4.dylib" "$LIB_DIR/libruby.3.4.dylib" || true
          fi

          # Bundle Homebrew dependencies
          for d in gmp libyaml openssl@3; do
            P=$(brew --prefix $d 2>/dev/null)/lib || continue
            if [ -d "$P" ]; then
               cp "$P"/*.dylib "$LIB_DIR/" 2>/dev/null || true
            fi
          done
          
          # Cleanup homebrew dylibs in our lib folder
          find "$LIB_DIR" -name "*.dylib" -type f | while read -r d; do
            chmod +w "$d"
            /usr/bin/codesign --remove-signature "$d" 2>/dev/null || true
            install_name_tool -id "@rpath/$(basename "$d")" "$d" || true
          done

          # 3. Build Gems
          echo "Installing Gems..."
          export PATH="$PORTABLE_DIR/bin:$PATH"
          export DYLD_LIBRARY_PATH="$LIB_DIR"
          
          gem install bundler -v 2.6.2 --no-document
          bundle config set --local path 'vendor/bundle'
          bundle config set --local deployment 'true'
          bundle install --jobs 4 --retry 3
          xattr -cr vendor/bundle || true

          # 4. Deep Portability Repair
          echo "Repairing all Mach-O files..."
          # Fix everything in dist and bundle. Use -print0 for safety.
          find "$PORTABLE_DIR" vendor/bundle -type f -print0 | while IFS= read -r -d '' f; do
            # Use 'file' and check for Mach-O
            if file "$f" 2>/dev/null | grep -q "Mach-O"; then
              chmod +w "$f" 2>/dev/null || true
              codesign --remove-signature "$f" 2>/dev/null || true
              
              # Add RPaths for various depths
              # We do these as list to avoid any shell complexity
              install_name_tool -add_rpath "@loader_path/../lib" "$f" 2>/dev/null || true
              install_name_tool -add_rpath "@loader_path/../../lib" "$f" 2>/dev/null || true
              install_name_tool -add_rpath "@loader_path/../../../lib" "$f" 2>/dev/null || true
              install_name_tool -add_rpath "@loader_path/../../../../lib" "$f" 2>/dev/null || true
              install_name_tool -add_rpath "@loader_path/../../../../../lib" "$f" 2>/dev/null || true
              install_name_tool -add_rpath "@loader_path/../../../../../../lib" "$f" 2>/dev/null || true
              install_name_tool -add_rpath "@loader_path/../../../../../../../lib" "$f" 2>/dev/null || true
              install_name_tool -add_rpath "@loader_path/../../../../../../../../lib" "$f" 2>/dev/null || true
              
              # Relink all hardcoded dependencies and libruby
              # Filter for dependencies that we bundled
              otool -L "$f" 2>/dev/null | grep -E "/opt/homebrew|/usr/local|libruby" | awk '{print $1}' | while read -r dep; do
                base=$(basename "$dep")
                if [ -f "$LIB_DIR/$base" ] && [[ "$dep" != "@rpath"* ]]; then
                  install_name_tool -change "$dep" "@rpath/$base" "$f" 2>/dev/null || true
                fi
              done
            fi
          done

          # 5. Smoke Test
          echo "Running smoke test..."
          unset DYLD_LIBRARY_PATH
          export GEM_HOME="$(pwd)/vendor/bundle/ruby/3.4.0"
          export GEM_PATH="$GEM_HOME:$PORTABLE_DIR/lib/ruby/gems/3.4.0"
          
          "$RUBY_BIN" -v
          "$RUBY_BIN" -e "require 'sqlite3'; puts 'SUCCESS: sqlite3 works portable!'"

          # 6. Production Signing
          IDENTITY="${{ secrets.APPLE_DEVELOPER_IDENTITY }}"
          ENTITLEMENTS="build/entitlements.mac.plist"
          if [ -n "$IDENTITY" ]; then
             echo "Performing production signing..."
             # Sign all native objects first
             find bin/ruby_dist/macos-arm64 vendor/bundle -type f -print0 | while IFS= read -r -d '' item; do
               if file "$item" 2>/dev/null | grep -q "Mach-O"; then
                 codesign --force --options runtime --timestamp -s "$IDENTITY" "$item" --verbose || true
               fi
             done
             echo "Signing interpreter..."
             codesign --force --options runtime --timestamp --entitlements "$ENTITLEMENTS" -s "$IDENTITY" "$RUBY_BIN" --verbose
          fi

      - name: Setup Native Dependencies (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          set -e
          mkdir -p bin/ruby_dist/win-x64
          URL="https://github.com/oneclick/rubyinstaller2/releases/download/RubyInstaller-3.4.1-1/rubyinstaller-3.4.1-1-x64.7z"
          curl -L "$URL" -o ruby.7z
          7z x ruby.7z -obin/ruby_dist/win-x64
          if [ -d bin/ruby_dist/win-x64/rubyinstaller-3.4.1-1-x64 ]; then
            mv bin/ruby_dist/win-x64/rubyinstaller-3.4.1-1-x64/* bin/ruby_dist/win-x64/
          fi
          bundle config set --local path 'vendor/bundle'
          bundle install --deployment || bundle install

      - name: Install Dependencies
        run: npm ci

      - name: Build Electron App
        run: npm run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CSC_LINK: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          CSC_KEY_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_P12_PASSWORD }}

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.os }}
          path: |
            dist/*.dmg
            dist/*.exe
            dist/*.zip
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Get version from package.json
        id: pkg_version
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          tag_name: v${{ steps.pkg_version.outputs.version }}
          name: Brilliant v${{ steps.pkg_version.outputs.version }}
          body: |
            ## Brilliant v${{ steps.pkg_version.outputs.version }}
            Signed and Notarized production build.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
