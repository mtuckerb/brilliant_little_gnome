name: Build and Release

on:
  push:
    branches:
      - release

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    environment: production

    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Import Apple Certificates
        if: matrix.os == 'macos-14'
        env:
          CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          P12_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_P12_PASSWORD }}
          K_PASS: "buildpassword123"
        run: |
          KEYCHAIN="build_action.keychain"
          echo "$CERTIFICATE_P12" | tr -d '\n ' | base64 --decode > certificate.p12
          security create-keychain -p "$K_PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$K_PASS" "$KEYCHAIN"
          security import certificate.p12 -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productsign
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | xargs)
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$K_PASS" "$KEYCHAIN"
          rm -f certificate.p12

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Ruby (System)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'

      - name: Setup and Sign Native Dependencies (macOS)
        if: matrix.os == 'macos-14'
        shell: bash
        run: |
          set -e
          echo "Starting macOS Native Setup..."
          
          # 1. Unpack Portable Ruby
          mkdir -p bin/ruby_dist/macos-arm64
          URL="https://github.com/ruby/ruby-builder/releases/download/ruby-3.4.1/ruby-3.4.1-darwin-arm64.tar.gz"
          echo "Fetching Ruby from $URL..."
          curl -L "$URL" | tar -xz -C bin/ruby_dist/macos-arm64 --strip-components=1
          
          PORTABLE_DIR="$(pwd)/bin/ruby_dist/macos-arm64"
          RUBY_BIN="$PORTABLE_DIR/bin/ruby"
          LIB_DIR="$PORTABLE_DIR/lib"
          
          # Initial permission fix
          chmod -R +w "$PORTABLE_DIR"
          chmod +x "$RUBY_BIN"
          xattr -cr "$PORTABLE_DIR" || true

          # 2. Fix Ruby Binary linkage to libruby
          echo "Repairing Ruby interpreter linkage..."
          codesign --remove-signature "$RUBY_BIN" || true
          # Find current libruby link
          CURR_LIBRUBY=$(otool -L "$RUBY_BIN" | grep libruby | awk '{print $1}' | head -n 1) || true
          if [ -n "$CURR_LIBRUBY" ]; then
            echo "Changing $CURR_LIBRUBY to @rpath/$(basename "$CURR_LIBRUBY")"
            install_name_tool -change "$CURR_LIBRUBY" "@rpath/$(basename "$CURR_LIBRUBY")" "$RUBY_BIN" || true
          fi
          install_name_tool -add_rpath "@executable_path/../lib" "$RUBY_BIN" 2>/dev/null || true

          # 3. Bundle dependencies from Homebrew
          echo "Bundling external libraries..."
          mkdir -p "$LIB_DIR"
          for dep in gmp libyaml openssl@3 readline; do
            DPATH=$(brew --prefix "$dep" 2>/dev/null)/lib || continue
            if [ -d "$DPATH" ]; then
              find "$DPATH" -name "*.dylib" -maxdepth 1 -type f | while read -r src; do
                base=$(basename "$src")
                if [[ ! -f "$LIB_DIR/$base" ]]; then
                  cp "$src" "$LIB_DIR/"
                  chmod +w "$LIB_DIR/$base"
                  codesign --remove-signature "$LIB_DIR/$base" 2>/dev/null || true
                  install_name_tool -id "@rpath/$base" "$LIB_DIR/$base" 2>/dev/null || true
                fi
              done
            fi
          done

          # 5. Build Gems (Using system ruby's bundle to install into the portable one)
          echo "Installing Gems..."
          export PATH="$PORTABLE_DIR/bin:$PATH"
          # Linker help for the installation phase
          export DYLD_LIBRARY_PATH="$LIB_DIR"
          
          # Clean bundle
          rm -rf vendor/bundle
          gem install bundler --no-document
          bundle config set --local path 'vendor/bundle'
          bundle config set --local deployment 'true'
          bundle install --jobs 4 --retry 3
          
          # 6. Recursive Portability Repair (Post-install)
          echo "Performing Deep Repair on all Mach-O files..."
          # Fix EVERYTHING in bin/ruby_dist and vendor/bundle
          find "$PORTABLE_DIR" vendor/bundle -type f | while read -r f; do
             # Check if Mach-O
             if (file "$f" 2>/dev/null || true) | grep -q "Mach-O"; then
                chmod +w "$f" 2>/dev/null || true
                codesign --remove-signature "$f" 2>/dev/null || true
                
                # Relink IDs for dylibs
                if [[ "$f" == *.dylib ]]; then
                   install_name_tool -id "@rpath/$(basename "$f")" "$f" 2>/dev/null || true
                fi
                
                # Add a set of recursive rpaths
                install_name_tool -add_rpath "@loader_path/../lib" "$f" 2>/dev/null || true
                install_name_tool -add_rpath "@loader_path/../../lib" "$f" 2>/dev/null || true
                install_name_tool -add_rpath "@loader_path/../../../lib" "$f" 2>/dev/null || true
                install_name_tool -add_rpath "@loader_path/../../../../lib" "$f" 2>/dev/null || true
                install_name_tool -add_rpath "@loader_path/../../../../../lib" "$f" 2>/dev/null || true
                install_name_tool -add_rpath "@loader_path/../../../../../../lib" "$f" 2>/dev/null || true
                install_name_tool -add_rpath "@loader_path/../../../../../../../lib" "$f" 2>/dev/null || true
                install_name_tool -add_rpath "@loader_path/../../../../../../../../lib" "$f" 2>/dev/null || true
                
                # Relink hardcoded dependencies to @rpath
                otool -L "$f" 2>/dev/null | grep -E "/opt/homebrew|/usr/local|libruby" | awk '{print $1}' | while read -r dep; do
                   base=$(basename "$dep")
                   if [ -f "$LIB_DIR/$base" ]; then
                      install_name_tool -change "$dep" "@rpath/$base" "$f" 2>/dev/null || true
                   fi
                done
             fi
          done

          # 7. Smoke Test
          echo "Verifying portability..."
          unset DYLD_LIBRARY_PATH
          export GEM_HOME="$(pwd)/vendor/bundle/ruby/3.4.0"
          export GEM_PATH="$GEM_HOME:$PORTABLE_DIR/lib/ruby/gems/3.4.0"
          "$RUBY_BIN" -v
          "$RUBY_BIN" -e "require 'sqlite3'; puts 'SUCCESS: sqlite3 loading from ' + Gem.loaded_specs['sqlite3'].full_gem_path"

          # 8. Production Signing
          IDENTITY="${{ secrets.APPLE_DEVELOPER_IDENTITY }}"
          ENTITLEMENTS="build/entitlements.mac.plist"
          if [ -n "$IDENTITY" ]; then
             echo "Performing production signing..."
             # Sign all native files first
             find vendor/bundle bin/ruby_dist/macos-arm64 -type f \( -name "*.dylib" -o -name "*.bundle" -o -name "*.so" \) | while read -r item; do
               codesign --force --options runtime --timestamp -s "$IDENTITY" "$item" || true
             done
             # Sign interpreter last with entitlements
             codesign --force --options runtime --timestamp --entitlements "$ENTITLEMENTS" -s "$IDENTITY" "$RUBY_BIN" || true
             codesign -vvv --deep --strict "$RUBY_BIN" || true
          fi

      - name: Setup Native Dependencies (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          set -e
          mkdir -p bin/ruby_dist/win-x64
          URL="https://github.com/oneclick/rubyinstaller2/releases/download/RubyInstaller-3.4.1-1/rubyinstaller-3.4.1-1-x64.7z"
          curl -L "$URL" -o ruby.7z
          7z x ruby.7z -obin/ruby_dist/win-x64
          if [ -d bin/ruby_dist/win-x64/rubyinstaller-3.4.1-1-x64 ]; then
            mv bin/ruby_dist/win-x64/rubyinstaller-3.4.1-1-x64/* bin/ruby_dist/win-x64/
          fi
          bundle config set --local path 'vendor/bundle'
          bundle install --deployment || bundle install

      - name: Install Dependencies
        run: npm ci

      - name: Build Electron App
        run: npm run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CSC_LINK: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          CSC_KEY_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_P12_PASSWORD }}

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.os }}
          path: |
            dist/*.dmg
            dist/*.exe
            dist/*.zip
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Get version from package.json
        id: pkg_version
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          tag_name: v${{ steps.pkg_version.outputs.version }}
          name: Brilliant v${{ steps.pkg_version.outputs.version }}
          body: |
            ## Brilliant v${{ steps.pkg_version.outputs.version }}
            Signed and Notarized production build.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
