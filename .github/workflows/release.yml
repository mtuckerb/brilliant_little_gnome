name: Build and Release

on:
  push:
    branches:
      - release

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    environment: production

    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Import Apple Certificates
        if: matrix.os == 'macos-14'
        env:
          CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          P12_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_P12_PASSWORD }}
          K_PASS: "buildpassword123"
        run: |
          KEYCHAIN="build_action.keychain"
          echo "$CERTIFICATE_P12" | tr -d '\n ' | base64 --decode > certificate.p12
          security create-keychain -p "$K_PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$K_PASS" "$KEYCHAIN"
          security import certificate.p12 -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productsign
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | xargs)
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$K_PASS" "$KEYCHAIN"
          rm -f certificate.p12

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Ruby (System)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'

      - name: Setup and Sign Native Dependencies (macOS)
        if: matrix.os == 'macos-14'
        shell: bash
        run: |
          set -e
          echo "Starting macOS Native Setup..."
          
          # 1. Unpack Portable Ruby
          mkdir -p bin/ruby_dist/macos-arm64
          URL="https://github.com/ruby/ruby-builder/releases/download/ruby-3.4.1/ruby-3.4.1-darwin-arm64.tar.gz"
          echo "Fetching Ruby from $URL..."
          curl -L "$URL" | tar -xz -C bin/ruby_dist/macos-arm64 --strip-components=1
          
          PORTABLE_DIR="$(pwd)/bin/ruby_dist/macos-arm64"
          RUBY_BIN="$PORTABLE_DIR/bin/ruby"
          LIB_DIR="$PORTABLE_DIR/lib"
          
          chmod -R +x "$PORTABLE_DIR/bin"
          xattr -cr "$PORTABLE_DIR" || true

          # 2. Bundle dependencies
          echo "Bundling dependencies..."
          mkdir -p "$LIB_DIR"
          
          # Find libruby
          LIBRUBY_SRC=$(find "$PORTABLE_DIR" -name "libruby.3.4.dylib" | head -n 1) || true
          if [ -n "$LIBRUBY_SRC" ] && [ ! -f "$LIB_DIR/$(basename "$LIBRUBY_SRC")" ]; then
             cp "$LIBRUBY_SRC" "$LIB_DIR/"
          fi

          # Bundle from brew
          for dep in gmp libyaml sqlite; do
            DPATH=$(brew --prefix "$dep" 2>/dev/null)/lib || continue
            if [ -d "$DPATH" ]; then
              find "$DPATH" -name "*.dylib" -maxdepth 1 -type f | while read -r src; do
                base=$(basename "$src")
                if [ ! -f "$LIB_DIR/$base" ]; then
                  cp "$src" "$LIB_DIR/"
                  chmod +w "$LIB_DIR/$base"
                  codesign --remove-signature "$LIB_DIR/$base" 2>/dev/null || true
                  install_name_tool -id "@rpath/$base" "$LIB_DIR/$base" 2>/dev/null || true
                fi
              done
            fi
          done

          # 3. Patch lib folder
          find "$LIB_DIR" -name "*.dylib" -type f | while read -r dylib; do
            chmod +w "$dylib"
            codesign --remove-signature "$dylib" 2>/dev/null || true
            install_name_tool -id "@rpath/$(basename "$dylib")" "$dylib" 2>/dev/null || true
            otool -L "$dylib" | grep -E "/opt/homebrew|/usr/local|libruby" | awk '{print $1}' | while read -r dep_link; do
              base=$(basename "$dep_link")
              if [ -f "$LIB_DIR/$base" ] && [[ "$dep_link" != "@rpath"* ]]; then
                install_name_tool -change "$dep_link" "@rpath/$base" "$dylib" 2>/dev/null || true
              fi
            done
          done

          # 4. Install Gems
          echo "Installing Gems..."
          export PATH="$PORTABLE_DIR/bin:$PATH"
          # Temporarily help the linker find the libs we just bundled
          export DYLD_LIBRARY_PATH="$LIB_DIR"
          
          "$RUBY_BIN" -S gem install bundler -v 2.6.2 --no-document
          bundle config set --local path 'vendor/bundle'
          bundle config set --local deployment 'true'
          bundle install --jobs 4 --retry 3
          xattr -cr vendor/bundle || true

          # 5. Global Portability Repair
          echo "Repairing native objects..."
          # Include PORTABLE_DIR and vendor/bundle. Avoid .git or other massive dirs.
          find bin/ruby_dist/macos-arm64 vendor/bundle -type f | while read -r f; do
            # Only process Mach-O files
            if (file "$f" 2>/dev/null || true) | grep -q "Mach-O"; then
              chmod +w "$f" 2>/dev/null || true
              codesign --remove-signature "$f" 2>/dev/null || true
              
              # Add variety of RPaths
              # We add them individually and ignore errors if they exist
              install_name_tool -add_rpath "@loader_path/../lib" "$f" 2>/dev/null || true
              install_name_tool -add_rpath "@loader_path/../../lib" "$f" 2>/dev/null || true
              install_name_tool -add_rpath "@loader_path/../../../lib" "$f" 2>/dev/null || true
              install_name_tool -add_rpath "@loader_path/../../../../lib" "$f" 2>/dev/null || true
              install_name_tool -add_rpath "@loader_path/../../../../../lib" "$f" 2>/dev/null || true
              install_name_tool -add_rpath "@loader_path/../../../../../../lib" "$f" 2>/dev/null || true
              install_name_tool -add_rpath "@loader_path/../../../../../../../lib" "$f" 2>/dev/null || true
              install_name_tool -add_rpath "@loader_path/../../../../../../../../lib" "$f" 2>/dev/null || true
              install_name_tool -add_rpath "@loader_path/../../../../../../../../../lib" "$f" 2>/dev/null || true
              
              # Also add direct rpath to the dist lib folder
              install_name_tool -add_rpath "@loader_path/../../../../../../../../../bin/ruby_dist/macos-arm64/lib" "$f" 2>/dev/null || true

              # Relink
              otool -L "$f" 2>/dev/null | grep -E "/opt/homebrew|/usr/local|libruby" | awk '{print $1}' | while read -r dep; do
                base=$(basename "$dep")
                if [ -f "$LIB_DIR/$base" ] && [[ "$dep" != "@rpath"* ]]; then
                   install_name_tool -change "$dep" "@rpath/$base" "$f" 2>/dev/null || true
                fi
              done
            fi
          done

          # 6. Verification
          echo "Running smoke test..."
          unset DYLD_LIBRARY_PATH
          export GEM_HOME="$(pwd)/vendor/bundle/ruby/3.4.0"
          export GEM_PATH="$GEM_HOME:$PORTABLE_DIR/lib/ruby/gems/3.4.0"
          
          "$RUBY_BIN" -v
          # Use a simple require that prints the path to the loaded bundle for debugging
          "$RUBY_BIN" -e "require 'sqlite3'; puts 'SUCCESS: sqlite3 loaded from ' + Gem.loaded_specs['sqlite3'].full_gem_path"

          # 7. Production Signing
          IDENTITY="${{ secrets.APPLE_DEVELOPER_IDENTITY }}"
          ENTITLEMENTS="build/entitlements.mac.plist"
          if [ -n "$IDENTITY" ]; then
             echo "Performing production signing..."
             # Sign native extensions and dylibs first
             find bin/ruby_dist/macos-arm64 vendor/bundle -type f \( -name "*.dylib" -o -name "*.bundle" -o -name "*.so" \) | while read -r item; do
               codesign --force --options runtime --timestamp -s "$IDENTITY" "$item" || true
             done
             # Sign the ruby binary with entitlements
             codesign --force --options runtime --timestamp --entitlements "$ENTITLEMENTS" -s "$IDENTITY" "$RUBY_BIN" || true
          fi

      - name: Setup Native Dependencies (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          set -e
          mkdir -p bin/ruby_dist/win-x64
          URL="https://github.com/oneclick/rubyinstaller2/releases/download/RubyInstaller-3.4.1-1/rubyinstaller-3.4.1-1-x64.7z"
          curl -L "$URL" -o ruby.7z
          7z x ruby.7z -obin/ruby_dist/win-x64
          if [ -d bin/ruby_dist/win-x64/rubyinstaller-3.4.1-1-x64 ]; then
            mv bin/ruby_dist/win-x64/rubyinstaller-3.4.1-1-x64/* bin/ruby_dist/win-x64/
          fi
          bundle config set --local path 'vendor/bundle'
          bundle install --deployment || bundle install

      - name: Install Dependencies
        run: npm ci

      - name: Build Electron App
        run: npm run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CSC_LINK: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          CSC_KEY_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_P12_PASSWORD }}

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.os }}
          path: |
            dist/*.dmg
            dist/*.exe
            dist/*.zip
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Get version from package.json
        id: pkg_version
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          tag_name: v${{ steps.pkg_version.outputs.version }}
          name: Brilliant v${{ steps.pkg_version.outputs.version }}
          body: |
            ## Brilliant v${{ steps.pkg_version.outputs.version }}
            Signed and Notarized production build.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
