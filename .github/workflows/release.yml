name: Build and Release

on:
  push:
    branches:
      - release

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Import Apple Certificates
        if: matrix.os == 'macos-14'
        env:
          CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          P12_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_P12_PASSWORD }}
          K_PASS: "buildpassword123"
        run: |
          # Decode secret into p12 file
          echo "$CERTIFICATE_P12" | base64 --decode > certificate.p12
          if [ ! -s certificate.p12 ]; then
            echo "Error: certificate.p12 is empty or does not exist"
            exit 1
          fi

          security create-keychain -p "$K_PASS" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security unlock-keychain -p "$K_PASS" build.keychain
          
          # Import with -A to allow all apps, and -f pkcs12 to be explicit
          security import certificate.p12 -k build.keychain -P "$P12_PASSWORD" -A -f pkcs12
          
          # Add to search list
          security list-keychains -d user -s build.keychain $(security list-keychains -d user | xargs)
          
          # Make default
          security default-keychain -s build.keychain
          
          # Setup partition list for non-interactive signing
          # This is critical for macOS 10.12+
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$K_PASS" build.keychain
          
          rm -f certificate.p12

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Ruby (System)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'

      - name: Setup and Sign Native Dependencies (macOS)
        if: matrix.os == 'macos-14'
        run: |
          set -e
          set -x
          mkdir -p bin/ruby_dist/macos-arm64
          # Provision portable ruby
          URL="https://github.com/ruby/ruby-builder/releases/download/ruby-3.4.1/ruby-3.4.1-darwin-arm64.tar.gz"
          curl -L "$URL" | tar -xz -C bin/ruby_dist/macos-arm64 --strip-components=1
          
          RB_BIN="bin/ruby_dist/macos-arm64/bin/ruby"
          RB_LIB="bin/ruby_dist/macos-arm64/lib/libruby.3.4.dylib"
          
          # Fix rpath for portability
          echo "Updating rpaths..."
          CURRENT_LIB=$(otool -L "$RB_BIN" | grep libruby | awk '{print $1}' | head -n 1)
          if [ ! -z "$CURRENT_LIB" ]; then
            install_name_tool -change "$CURRENT_LIB" "@executable_path/../lib/libruby.3.4.dylib" "$RB_BIN"
          fi
          install_name_tool -add_rpath "@executable_path/../lib" "$RB_BIN" || true

          # Use system ruby to install gems into the app's vendor folder
          bundle config set --local path 'vendor/bundle'
          bundle install --deployment || bundle install

          # Identity for signing - will use the imported certificate
          # Expected secret: APPLE_DEVELOPER_IDENTITY (e.g., "Developer ID Application: Your Name (ID)")
          IDENTITY="${{ secrets.APPLE_DEVELOPER_IDENTITY }}"
          
          echo "Hardening and Signing Native Binaries with Identity: $IDENTITY"
          ENTITLEMENTS="build/entitlements.mac.plist"
          
          find bin/ruby_dist/macos-arm64 -type f \( -name "ruby" -o -name "*.dylib" -o -name "*.bundle" -o -name "*.so" \) -exec codesign --deep --force --options runtime --entitlements "$ENTITLEMENTS" -s "$IDENTITY" {} \;
          find vendor/bundle -type f \( -name "*.dylib" -o -name "*.bundle" -o -name "*.so" \) -exec codesign --deep --force --options runtime --entitlements "$ENTITLEMENTS" -s "$IDENTITY" {} \;

      - name: Setup Native Dependencies (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          set -e
          set -x
          mkdir -p bin/ruby_dist/win-x64
          # Provision portable ruby
          URL="https://github.com/oneclick/rubyinstaller2/releases/download/RubyInstaller-3.4.1-1/rubyinstaller-3.4.1-1-x64.7z"
          curl -L "$URL" -o ruby.7z
          7z x ruby.7z -obin/ruby_dist/win-x64
          # Re-root the portable folder

          if [ -d bin/ruby_dist/win-x64/rubyinstaller-3.4.1-1-x64 ]; then
            mv bin/ruby_dist/win-x64/rubyinstaller-3.4.1-1-x64/* bin/ruby_dist/win-x64/
          fi
          
          # Install gems into vendor folder using system ruby (setup-ruby)
          bundle config set --local path 'vendor/bundle'
          bundle install --deployment || bundle install

      - name: Install Dependencies
        run: npm ci

      - name: Build Electron App
        run: npm run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CSC_LINK: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          CSC_KEY_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_P12_PASSWORD }}
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: List Build Output
        run: ls -R dist/

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.os }}
          path: |
            dist/*.dmg
            dist/*.exe
            dist/*.zip
            dist/*.blockmap
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Display structure of downloaded artifacts
        run: ls -R artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          tag_name: v${{ github.run_number }}
          name: Brilliant v${{ github.run_number }}
          draft: false
          prerelease: false
          body: |
            ## Brilliant Release v${{ github.run_number }}
            
            ###  macOS Update
            This build is now **Properly Signed and Notarized** with a valid Apple Developer Certificate. 
            It should open directly on Apple Silicon and Intel Macs without "Damaged" or Gatekeeper warnings.
            
            ---
            *Automated build from release branch.*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
