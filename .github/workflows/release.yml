name: Build and Release

on:
  push:
    branches:
      - release

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Ruby (System)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'

      - name: Setup Native Dependencies (macOS)
        if: matrix.os == 'macos-14'
        run: |
          set -e
          set -x
          mkdir -p bin/ruby_dist/macos-arm64
          # Provision portable ruby
          URL="https://github.com/ruby/ruby-builder/releases/download/ruby-3.4.1/ruby-3.4.1-darwin-arm64.tar.gz"
          curl -L "$URL" | tar -xz -C bin/ruby_dist/macos-arm64 --strip-components=1
          
          RB_BIN="bin/ruby_dist/macos-arm64/bin/ruby"
          RB_LIB="bin/ruby_dist/macos-arm64/lib/libruby.3.4.dylib"
          
          # Fix rpath for portability
          echo "Updating rpaths..."
          CURRENT_LIB=$(otool -L "$RB_BIN" | grep libruby | awk '{print $1}' | head -n 1)
          if [ ! -z "$CURRENT_LIB" ]; then
            install_name_tool -change "$CURRENT_LIB" "@executable_path/../lib/libruby.3.4.dylib" "$RB_BIN"
          fi
          install_name_tool -add_rpath "@executable_path/../lib" "$RB_BIN" || true

          # Use system ruby to install gems into the app's vendor folder
          bundle config set --local path 'vendor/bundle'
          bundle install --deployment || bundle install

          # Recursive ad-hoc signing for all binaries and libraries (Required for Apple Silicon)
          echo "Ad-hoc signing and hardening binaries..."
          find bin/ruby_dist/macos-arm64 -type f \( -name "ruby" -o -name "*.dylib" -o -name "*.bundle" -o -name "*.so" \) -exec codesign -s - -f --options runtime {} \;
          find vendor/bundle -type f \( -name "*.dylib" -o -name "*.bundle" -o -name "*.so" \) -exec codesign -s - -f --options runtime {} \;

      - name: Setup Native Dependencies (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          set -e
          set -x
          mkdir -p bin/ruby_dist/win-x64
          # Provision portable ruby
          URL="https://github.com/oneclick/rubyinstaller2/releases/download/RubyInstaller-3.4.1-1/rubyinstaller-3.4.1-1-x64.7z"
          curl -L "$URL" -o ruby.7z
          7z x ruby.7z -obin/ruby_dist/win-x64
          # Re-root the portable folder

          if [ -d bin/ruby_dist/win-x64/rubyinstaller-3.4.1-1-x64 ]; then
            mv bin/ruby_dist/win-x64/rubyinstaller-3.4.1-1-x64/* bin/ruby_dist/win-x64/
          fi
          
          # Install gems into vendor folder using system ruby (setup-ruby)
          bundle config set --local path 'vendor/bundle'
          bundle install --deployment || bundle install

      - name: Install Dependencies
        run: npm ci

      - name: Build Electron App
        run: npm run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: List Build Output
        run: ls -R dist/

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.os }}
          path: |
            dist/*.dmg
            dist/*.exe
            dist/*.zip
            dist/*.blockmap
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Display structure of downloaded artifacts
        run: ls -R artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          tag_name: v${{ github.run_number }}
          name: Brilliant v${{ github.run_number }}
          draft: false
          prerelease: false
          body: |
            ## Brilliant Release v${{ github.run_number }}
            
            ###  macOS Installation Note (Apple Silicon)
            Because this app is not notarized by Apple, you may see a message saying **"Brilliant is damaged and can't be opened."**
            
            This is a security feature (Gatekeeper) for apps downloaded from the internet. To fix it:
            1. Drag **Brilliant** to your **Applications** folder.
            2. Open **Terminal** and run this command:
               ```bash
               xattr -cr /Applications/Brilliant.app
               ```
            3. Open the app as usual.
            
            ---
            *Automated build from release branch.*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
