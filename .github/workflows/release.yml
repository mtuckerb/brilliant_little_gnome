name: Build and Release

on:
  push:
    branches:
      - release

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    environment: production

    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Import Apple Certificates
        if: matrix.os == 'macos-14'
        env:
          CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          P12_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_P12_PASSWORD }}
          K_PASS: "buildpassword123"
        run: |
          # Use a unique name for the keychain
          KEYCHAIN="build_action.keychain"
          
          echo "Checking secret availability..."
          if [ -z "$CERTIFICATE_P12" ]; then
            echo "::error::APPLE_CERTIFICATE_P12 is empty! Check GitHub Repo Secrets."
            exit 1
          fi
          if [ -z "$P12_PASSWORD" ]; then
            echo "::error::APPLE_CERTIFICATE_P12_PASSWORD is empty! Check GitHub Repo Secrets."
            exit 1
          fi

          # Decode secret into p12 file - tr -d removes any accidental whitespace/newlines
          echo "$CERTIFICATE_P12" | tr -d '\n ' | base64 --decode > certificate.p12
          
          if [ ! -s certificate.p12 ]; then
            echo "::error::certificate.p12 decoding resulted in an empty file."
            exit 1
          fi

          security create-keychain -p "$K_PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$K_PASS" "$KEYCHAIN"
          
          # Import with -P for the P12 password and -k for the target keychain
          security import certificate.p12 -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productsign
          
          # Fix the search list to include the new keychain
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | xargs)
          
          # Critical for macOS 10.12+: allow the partition to be accessed by code signing
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$K_PASS" "$KEYCHAIN"
          
          rm -f certificate.p12

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Ruby (System)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'

      - name: Setup and Sign Native Dependencies (macOS)
        if: matrix.os == 'macos-14'
        run: |
          set -e
          set -x
          mkdir -p bin/ruby_dist/macos-arm64
          # Provision portable ruby
          URL="https://github.com/ruby/ruby-builder/releases/download/ruby-3.4.1/ruby-3.4.1-darwin-arm64.tar.gz"
          curl -L "$URL" | tar -xz -C bin/ruby_dist/macos-arm64 --strip-components=1
          
          # Clean up any extended attributes before signing
          xattr -cr bin/ruby_dist/macos-arm64
          
          RB_BIN="bin/ruby_dist/macos-arm64/bin/ruby"
          RB_LIB="bin/ruby_dist/macos-arm64/lib/libruby.3.4.dylib"
          
          # Fix rpath for portability
          echo "Updating rpaths..."
          CURRENT_LIB=$(otool -L "$RB_BIN" | grep libruby | awk '{print $1}' | head -n 1)
          if [ ! -z "$CURRENT_LIB" ]; then
            install_name_tool -change "$CURRENT_LIB" "@executable_path/../lib/libruby.3.4.dylib" "$RB_BIN"
          fi
          install_name_tool -add_rpath "@executable_path/../lib" "$RB_BIN" || true

          # Use system ruby to install gems into the app's vendor folder
          bundle config set --local path 'vendor/bundle'
          bundle install --deployment || bundle install
          # Clean up gem extended attributes
          xattr -cr vendor/bundle

          echo "Bundling and Fixup missing dependencies (libgmp and libyaml)..."
          LIB_DEST="bin/ruby_dist/macos-arm64/lib"
          
          # Bundle libgmp
          GMP_PATH=$(brew --prefix gmp)/lib/libgmp.10.dylib
          if [ -f "$GMP_PATH" ]; then
            cp "$GMP_PATH" "$LIB_DEST/"
            chmod 644 "$LIB_DEST/libgmp.10.dylib"
            install_name_tool -id "@loader_path/libgmp.10.dylib" "$LIB_DEST/libgmp.10.dylib"
          fi
          
          # Bundle libyaml
          YAML_PATH=$(brew --prefix libyaml)/lib/libyaml-0.2.dylib
          if [ -f "$YAML_PATH" ]; then
            cp "$YAML_PATH" "$LIB_DEST/"
            chmod 644 "$LIB_DEST/libyaml-0.2.dylib"
            install_name_tool -id "@loader_path/libyaml-0.2.dylib" "$LIB_DEST/libyaml-0.2.dylib"
          fi

          # Standardize dependencies for ALL native files
          echo "Standardizing native library paths..."
          find bin/ruby_dist/macos-arm64 vendor/bundle -type f \( -perm +111 -o -name "*.dylib" -o -name "*.bundle" -o -name "*.so" \) | while read -r binary; do
            # Standardize Homebrew paths to relative paths
            otool -L "$binary" 2>/dev/null | grep "/opt/homebrew" | awk '{print $1}' | while read -r old_path; do
              lib_name=$(basename "$old_path")
              if [ -f "$LIB_DEST/$lib_name" ]; then
                # Prefer relative to executable if in bin/, else relative to current folder
                if [[ "$binary" == */bin/* ]]; then
                  install_name_tool -change "$old_path" "@executable_path/../lib/$lib_name" "$binary" 2>/dev/null || true
                else
                  install_name_tool -change "$old_path" "@loader_path/../lib/$lib_name" "$binary" 2>/dev/null || \
                  install_name_tool -change "$old_path" "@loader_path/$lib_name" "$binary" 2>/dev/null || true
                fi
              fi
            done
          done

          # Final verification and pre-signing
          IDENTITY="${{ secrets.APPLE_DEVELOPER_IDENTITY }}"
          ENTITLEMENTS="build/entitlements.mac.plist"
          
          echo "Pre-signing native binaries with Hardened Runtime..."
          
          # One pass to sign ALL dependencies including our new bundled ones
          find bin/ruby_dist/macos-arm64 vendor/bundle -type f \( -name "*.dylib" -o -name "*.bundle" -o -name "*.so" \) | while read -r file; do
             codesign --force --options runtime --timestamp -s "$IDENTITY" "$file"
          done
          
          # Sign the main Ruby executable last with entitlements
          codesign --force --options runtime --timestamp --entitlements "$ENTITLEMENTS" -s "$IDENTITY" "$RB_BIN"
          
          echo "Verifying Ruby signature..."
          codesign -vvv --deep --strict "$RB_BIN"

      - name: Setup Native Dependencies (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          set -e
          set -x
          mkdir -p bin/ruby_dist/win-x64
          # Provision portable ruby
          URL="https://github.com/oneclick/rubyinstaller2/releases/download/RubyInstaller-3.4.1-1/rubyinstaller-3.4.1-1-x64.7z"
          curl -L "$URL" -o ruby.7z
          7z x ruby.7z -obin/ruby_dist/win-x64
          # Re-root the portable folder

          if [ -d bin/ruby_dist/win-x64/rubyinstaller-3.4.1-1-x64 ]; then
            mv bin/ruby_dist/win-x64/rubyinstaller-3.4.1-1-x64/* bin/ruby_dist/win-x64/
          fi
          
          # Install gems into vendor folder using system ruby (setup-ruby)
          bundle config set --local path 'vendor/bundle'
          bundle install --deployment || bundle install

      - name: Install Dependencies
        run: npm ci

      - name: Build Electron App
        run: npm run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Use CSC_LINK and CSC_KEY_PASSWORD for more reliable CI signing
          CSC_LINK: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          CSC_KEY_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_P12_PASSWORD }}

      - name: List Build Output
        run: ls -R dist/

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.os }}
          path: |
            dist/*.dmg
            dist/*.exe
            dist/*.zip
            dist/*.blockmap
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Get version from package.json
        id: pkg_version
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          tag_name: v${{ steps.pkg_version.outputs.version }}
          name: Brilliant v${{ steps.pkg_version.outputs.version }}
          draft: false
          prerelease: false
          body: |
            ## Brilliant Release v${{ steps.pkg_version.outputs.version }}
            
            ###  macOS Update
            This build is now **Properly Signed and Notarized** with a valid Apple Developer Certificate. 
            It should open directly on Apple Silicon and Intel Macs without "Damaged" or Gatekeeper warnings.
            
            ---
            *Automated build from release branch.*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
