openapi: 3.0.0
info:
  title: Brilliant Sidecar API
  version: 1.3.0
  description: |
    REST API for interacting with cached LMS data and Model Context Protocol (MCP) server integration.
    
    All `/api/v1/*` endpoints require an `X-API-KEY` header unless otherwise specified.

servers:
  - url: /api/v1
    description: Local API server

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-KEY

  schemas:
    Course:
      type: object
      properties:
        id: { type: integer }
        org_unit_id: { type: string }
        name: { type: string }
        code: { type: string }
        semester: { type: string }
        is_pinned: { type: boolean }
        last_accessed_at: { type: string, format: date-time }
        banner_url: { type: string }

    Notification:
      type: object
      properties:
        id: { type: integer }
        external_id: { type: string }
        title: { type: string }
        body: { type: string }
        date: { type: string, format: date-time }
        course_id: { type: string }
        course_name: { type: string }
        semester: { type: string }
        urgency: { type: integer, description: "1 (Low) to 5 (High)" }
        is_personal: { type: boolean }
        is_read: { type: boolean }
        url: { type: string }

    Grade:
      type: object
      properties:
        id: { type: integer }
        brightspace_id: { type: string }
        name: { type: string }
        displayed_grade: { type: string }
        numerator: { type: number }
        denominator: { type: number }
        weight: { type: number }
        due_date: { type: string, format: date-time }
        comments: { type: string }

    Preferences:
      type: object
      properties:
        display_name: { type: string }
        time_zone: { type: string }
        historic_gpa: { type: number }
        historic_units: { type: integer }
        default_semester: { type: string }

security:
  - ApiKeyAuth: []

paths:
  /status:
    get:
      summary: Check system and authentication status
      responses:
        '200':
          description: System status
          content:
            application/json:
              schema:
                type: object
                properties:
                  authenticated: { type: boolean }
                  degraded_mode: { type: boolean }
                  host: { type: string }
                  sync_status: { type: object }

  /courses:
    get:
      summary: List all courses
      description: Returns localized course data. MCP tool `list_courses` provides additional property-level filtering.
      responses:
        '200':
          description: List of courses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Course'

  /courses/{id}/grades:
    get:
      summary: Get course grades
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: List of grade entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Grade'

  /notifications:
    get:
      summary: Retrieve notifications with filtering
      parameters:
        - name: course_id
          in: query
          schema: { type: string }
        - name: semester
          in: query
          schema: { type: string }
        - name: urgency
          in: query
          schema: { type: integer }
        - name: is_personal
          in: query
          schema: { type: boolean }
        - name: show_read
          in: query
          description: Include read notifications (default false)
          schema: { type: boolean }
        - name: limit
          in: query
          schema: { type: integer, default: 50 }
      responses:
        '200':
          description: List of notifications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Notification'

  /preferences:
    get:
      summary: Retrieve current preferences
      responses:
        '200':
          description: User settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Preferences'
    patch:
      summary: Update user settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Preferences'
      responses:
        '200':
          description: Updated settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Preferences'
        '422':
          description: Validation error

  /mcp/sse:
    get:
      summary: MCP SSE Connection Endpoint
      description: Establishes a Server-Sent Events stream for Model Context Protocol.
      security:
        - ApiKeyAuth: []
      responses:
        '200':
          description: SSE Stream established

  /mcp/messages:
    post:
      summary: MCP JSON-RPC Message Handler
      parameters:
        - name: session_id
          in: query
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                jsonrpc: { type: string, example: "2.0" }
                id: { type: string }
                method: { type: string }
                params: { type: object }
      responses:
        '202':
          description: Message accepted for processing
        '200':
          description: Direct synchronous response
