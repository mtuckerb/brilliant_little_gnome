openapi: 3.0.3
info:
  title: Brilliant API
  version: 2.0.0
  license:
    name: All rights reserved
    url: https://github.com/mtuckerb/brilliant_little_gnome
  description: |
    Authoritative contract for the embedded HTTP server in Brilliant Desktop 2.

    Protected endpoints accept any one of:
    - the static API key as `Authorization: Bearer <api-key>`;
    - the static API key as `X-API-Key: <api-key>`;
    - the static API key as the `api_key` query parameter; or
    - a JWT returned by `GET /api/v1/token` as a Bearer token.

    The API must be enabled in Brilliant under Settings → REST API. The health
    check, Swagger UI, OpenAPI document, and Brightspace cookie handoff are public.
    MCP uses JSON-RPC 2.0 over Streamable HTTP at `POST /mcp`.
servers:
  - url: /
    description: Embedded Brilliant Desktop server

security:
  - BearerAuth: []
  - ApiKeyHeader: []
  - ApiKeyQuery: []

tags:
  - name: System
    description: Server health, authentication state, and configuration
  - name: Courses
    description: Course metadata, grades, discussions, dashboards, and exports
  - name: Assignments
    description: Synced and user-created coursework
  - name: Notifications
    description: Cached Brightspace alerts and announcements
  - name: Search
    description: Cross-course cached-data search
  - name: MCP
    description: Model Context Protocol over Streamable HTTP

paths:
  /health:
    get:
      tags: [System]
      summary: Check server health
      operationId: getHealth
      security: []
      responses:
        "200":
          description: Server is running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "405":
          description: Method not allowed

  /api/v1/auth/cookies:
    post:
      tags: [System]
      summary: Store a Brightspace host and session cookie
      operationId: setAuthCookies
      description: Used by the browser-extension and desktop reauthentication flow.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [host, cookies]
              properties:
                host:
                  type: string
                  example: courses.example.edu
                cookies:
                  type: string
                  writeOnly: true
      responses:
        "200":
          description: Credentials stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ok"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: Credentials were stored locally but could not be safely shared with paired devices
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/status:
    get:
      tags: [System]
      summary: Get Brightspace authentication and synchronization status
      operationId: getStatus
      responses:
        "200":
          description: Current status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/preferences:
    get:
      tags: [System]
      summary: Get non-secret user preferences
      operationId: getPreferences
      responses:
        "200":
          description: Preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Preferences"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/token:
    get:
      tags: [System]
      summary: Issue a JWT valid for 24 hours
      operationId: issueToken
      responses:
        "200":
          description: JWT for subsequent Bearer authentication
          content:
            application/json:
              schema:
                type: object
                required: [token]
                properties:
                  token:
                    type: string
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/courses:
    get:
      tags: [Courses]
      summary: List courses
      operationId: listCourses
      responses:
        "200":
          description: Courses ordered by pin and custom sort order
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Course"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/courses/reorder:
    post:
      tags: [Courses]
      summary: Set course sort order
      operationId: reorderCourses
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids:
                  type: array
                  items:
                    type: string
      responses:
        "200":
          description: Sort order updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ok"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/courses/{id}:
    get:
      tags: [Courses]
      summary: Get one course
      operationId: getCourse
      parameters:
        - $ref: "#/components/parameters/CourseId"
      responses:
        "200":
          description: Course
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Course"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/courses/{id}/export:
    get:
      tags: [Courses]
      summary: Export a course as a ZIP archive
      operationId: exportCourse
      description: Includes the module tree, downloadable files, and Markdown content pages.
      parameters:
        - $ref: "#/components/parameters/CourseId"
      responses:
        "200":
          description: Course archive
          headers:
            Content-Disposition:
              schema:
                type: string
          content:
            application/zip:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/courses/{id}/grades/summary:
    get:
      tags: [Courses]
      summary: Get grade rows and calculated course statistics
      operationId: getCourseGrades
      parameters:
        - $ref: "#/components/parameters/CourseId"
      responses:
        "200":
          description: Grades and roll-up statistics
          content:
            application/json:
              schema:
                type: object
                required: [grades, grade_stats]
                properties:
                  grades:
                    type: array
                    items:
                      $ref: "#/components/schemas/Grade"
                  grade_stats:
                    type: object
                    additionalProperties: true
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/courses/{id}/assignments/summary:
    get:
      tags: [Assignments]
      summary: Get assignments for a course
      operationId: getCourseAssignments
      parameters:
        - $ref: "#/components/parameters/CourseId"
        - name: show_completed
          in: query
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Assignment list
          content:
            application/json:
              schema:
                type: object
                required: [assignments]
                properties:
                  assignments:
                    type: array
                    items:
                      $ref: "#/components/schemas/Assignment"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/courses/{id}/discussions:
    get:
      tags: [Courses]
      summary: List cached discussion topics for a course
      operationId: listCourseDiscussions
      parameters:
        - $ref: "#/components/parameters/CourseId"
      responses:
        "200":
          description: Discussion topics with activity counts
          content:
            application/json:
              schema:
                type: object
                required: [topics]
                properties:
                  topics:
                    type: array
                    items:
                      $ref: "#/components/schemas/DiscussionTopic"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/assignments:
    post:
      tags: [Assignments]
      summary: Create a synthetic assignment
      operationId: createAssignment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAssignment"
      responses:
        "200":
          description: Assignment created
          content:
            application/json:
              schema:
                type: object
                required: [status, id, brightspace_id]
                properties:
                  status:
                    type: string
                  id:
                    type: integer
                  brightspace_id:
                    type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/notifications:
    get:
      tags: [Notifications]
      summary: List notifications
      operationId: listNotifications
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 25
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: show_read
          in: query
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Paginated notifications
          content:
            application/json:
              schema:
                type: object
                required: [total, limit, offset, notifications]
                properties:
                  total:
                    type: integer
                  limit:
                    type: integer
                  offset:
                    type: integer
                  notifications:
                    type: array
                    items:
                      $ref: "#/components/schemas/Notification"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/dashboard/summary:
    get:
      tags: [Courses]
      summary: Get cross-course dashboard data
      operationId: getDashboardSummary
      responses:
        "200":
          description: Courses, upcoming assignments, and unread notifications
          content:
            application/json:
              schema:
                type: object
                properties:
                  courses:
                    type: array
                    items:
                      $ref: "#/components/schemas/Course"
                  upcoming_assignments:
                    type: array
                    items:
                      $ref: "#/components/schemas/Assignment"
                  recent_notifications:
                    type: array
                    items:
                      $ref: "#/components/schemas/Notification"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/search:
    get:
      tags: [Search]
      summary: Search cached Brilliant data
      operationId: search
      description: Searches courses, assignments, content items, discussion topics, and notifications.
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Search results
          content:
            application/json:
              schema:
                type: object
                required: [results]
                properties:
                  results:
                    type: array
                    items:
                      $ref: "#/components/schemas/SearchResult"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /mcp:
    post:
      tags: [MCP]
      summary: Send an MCP JSON-RPC message
      operationId: sendMcpMessage
      description: |
        Streamable HTTP endpoint implementing MCP protocol version 2025-03-26.
        Supported methods are `initialize`, `ping`, `tools/list`, and `tools/call`.
        Notifications without an `id` return HTTP 202 with no body.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JsonRpcRequest"
      responses:
        "200":
          description: JSON-RPC response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonRpcResponse"
        "202":
          description: Notification accepted
        "401":
          $ref: "#/components/responses/Unauthorized"

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: API key or JWT
    ApiKeyHeader:
      type: apiKey
      in: header
      name: X-API-Key
    ApiKeyQuery:
      type: apiKey
      in: query
      name: api_key

  parameters:
    CourseId:
      name: id
      in: path
      required: true
      description: Brightspace course OrgUnitId
      schema:
        type: string

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Missing or invalid API credential
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Health:
      type: object
      required: [status, version]
      properties:
        status:
          type: string
          example: ok
        version:
          type: string
          example: 2.0.0

    Ok:
      type: object
      required: [status]
      properties:
        status:
          type: string
          example: ok

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string

    Status:
      type: object
      required: [authenticated, degraded_mode, sync_status]
      properties:
        authenticated:
          type: boolean
        degraded_mode:
          type: boolean
        host:
          type: string
          nullable: true
        sync_status:
          type: object
          additionalProperties: true

    Preferences:
      type: object
      properties:
        id:
          type: integer
        display_name:
          type: string
          nullable: true
        time_zone:
          type: string
          nullable: true
        brightspace_host:
          type: string
          nullable: true
        api_enabled:
          type: boolean
        api_listen_all:
          type: boolean
        api_port:
          type: integer
        historic_gpa:
          type: number
          nullable: true
        historic_units:
          type: integer
          nullable: true
        default_semester:
          type: string
          nullable: true
        brightspace_uid:
          type: string
          nullable: true
        brightspace_user_id:
          type: string
          nullable: true
        last_login_at:
          type: string
          nullable: true

    Course:
      type: object
      required: [org_unit_id, name]
      properties:
        org_unit_id:
          type: string
        name:
          type: string
        custom_name:
          type: string
          nullable: true
        code:
          type: string
          nullable: true
        semester:
          type: string
          nullable: true
        is_pinned:
          type: boolean
        custom_color:
          type: string
          nullable: true
        banner_url:
          type: string
          nullable: true
        units:
          type: integer
          nullable: true
        target_grade:
          type: number
          nullable: true
        status:
          type: string
          nullable: true
        sort_order:
          type: integer
        last_accessed_at:
          type: string
          nullable: true

    Grade:
      type: object
      properties:
        id:
          type: integer
        course_id:
          type: string
        brightspace_id:
          type: string
          nullable: true
        name:
          type: string
        displayed_grade:
          type: string
          nullable: true
        numerator:
          type: number
          nullable: true
        denominator:
          type: number
          nullable: true
        weight:
          type: number
          nullable: true
        due_date:
          type: string
          nullable: true
        comments:
          type: string
          nullable: true

    Assignment:
      type: object
      properties:
        id:
          type: integer
        course_id:
          type: string
        brightspace_id:
          type: string
        name:
          type: string
        due_date:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        assignment_type:
          type: string
          nullable: true
        completed:
          type: boolean
        synthetic:
          type: boolean
        optional:
          type: boolean
        external_url:
          type: string
          nullable: true

    CreateAssignment:
      type: object
      required: [course_id, name]
      properties:
        course_id:
          type: string
        name:
          type: string
        description:
          type: string
        due_date:
          type: string
          format: date
        due_time:
          type: string
          example: "17:00"
        external_url:
          type: string
          format: uri

    DiscussionTopic:
      type: object
      properties:
        id:
          type: integer
        brightspace_id:
          type: string
        course_id:
          type: string
        forum_id:
          type: string
        name:
          type: string
        description:
          type: string
          nullable: true
        sort_order:
          type: integer
        thread_count:
          type: integer
        post_count:
          type: integer
        last_post_date:
          type: string
          nullable: true

    Notification:
      type: object
      properties:
        id:
          type: integer
        external_id:
          type: string
        notification_type:
          type: string
        title:
          type: string
        body:
          type: string
          nullable: true
        date:
          type: string
          nullable: true
        course_id:
          type: string
          nullable: true
        course_name:
          type: string
          nullable: true
        urgency:
          type: integer
        is_personal:
          type: boolean
        is_read:
          type: boolean
        url:
          type: string
          nullable: true

    SearchResult:
      type: object
      required: [type, title, url]
      properties:
        type:
          type: string
          enum: [course, assignment, content, discussion, notification]
        title:
          type: string
        url:
          type: string
        subtitle:
          type: string
          nullable: true
        course_id:
          type: string
          nullable: true

    JsonRpcRequest:
      type: object
      required: [jsonrpc, method]
      properties:
        jsonrpc:
          type: string
          enum: ["2.0"]
        id:
          oneOf:
            - type: string
            - type: integer
        method:
          type: string
        params:
          type: object
          additionalProperties: true

    JsonRpcResponse:
      type: object
      required: [jsonrpc, id]
      properties:
        jsonrpc:
          type: string
          enum: ["2.0"]
        id:
          oneOf:
            - type: string
            - type: integer
        result:
          description: Method-specific JSON-RPC result
        error:
          type: object
          properties:
            code:
              type: integer
            message:
              type: string
